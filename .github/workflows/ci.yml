# The repo's own check, next to the rig catalog's secret-scan.yml. Runs on the Forgejo runners
# for every pull request and on pushes to main (a PR branch is covered by its pull_request run).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Lint
        run: uv run --locked ruff check .
      - name: Tests
        run: uv run --locked pytest -q
